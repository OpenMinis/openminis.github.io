<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Return to Handl</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f4f5f9;
        color: #101114;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 3.25rem);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 auto 1.5rem;
        max-width: 28rem;
        color: #6f727a;
        font-size: 1.05rem;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        min-width: 12rem;
        padding: 0.95rem 1.4rem;
        border-radius: 999px;
        background: #1677ff;
        color: white;
        font-weight: 650;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111216; color: #f8f8fa; }
        p { color: #a8aab2; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Return to Handl</h1>
      <p>Continue in Handl to finish the secure bank connection. Your bank credentials are never shown on this page.</p>
      <a href="minis://finance-link-complete">Open Handl</a>
    </main>
  </body>
</html>
